<style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
// ---------- Arabalar (hepsi özgün, kodla üretilir) ----------
const CARS=[
 {n:'Tosun',p:0,c:0xff7a1a,s:0x222222,l:4.2,w:2,h:.8,k:.7,kz:-.05,sp:0,wr:.5,mx:55,ac:16,gr:5,st:2},
 {n:'Şimşek',p:200,c:0x2a9bff,s:0xffffff,l:4.6,w:2,h:.6,k:.5,kz:-.1,sp:1,wr:.45,mx:66,ac:20,gr:6,st:2.1},
 {n:'Zıpzıp',p:500,c:0xffd22a,s:0x333333,l:3.6,w:2.2,h:.6,k:.5,kz:.1,sp:0,wr:.7,mx:60,ac:22,gr:7,st:2.4},
 {n:'Fırtına',p:900,c:0xf2f2f2,s:0xd22,l:4.4,w:2,h:.7,k:.6,kz:-.05,sp:1,wr:.5,mx:76,ac:24,gr:6.5,st:2.2},
 {n:'Cip',p:1400,c:0x3f9a3a,s:0x222222,l:4.2,w:2.2,h:1,k:.9,kz:-.2,sp:0,wr:.8,mx:62,ac:24,gr:8,st:2.2},
 {n:'Ateş Kuşu',p:2000,c:0xe0262f,s:0x111111,l:4.8,w:2.1,h:.6,k:.5,kz:-.1,sp:1,wr:.5,mx:86,ac:28,gr:7.5,st:2.3},
 {n:'Pembe Bulut',p:2800,c:0xff6fb5,s:0xffffff,l:4,w:1.9,h:.75,k:.65,kz:-.05,sp:0,wr:.48,mx:70,ac:30,gr:9,st:2.6},
 {n:'Dev Pati',p:3800,c:0x79d12b,s:0x222222,l:4.6,w:2.4,h:1.1,k:.9,kz:-.1,sp:0,wr:.95,mx:92,ac:32,gr:8,st:2.2},
 {n:'Gece Kartalı',p:5000,c:0x15151c,s:0xa040ff,l:4.9,w:2.1,h:.55,k:.45,kz:-.1,sp:1,wr:.5,mx:105,ac:36,gr:8.5,st:2.4},
 {n:'Roket',p:7000,c:0xc8d2dc,s:0x00e0ff,l:5.2,w:2,h:.5,k:.4,kz:-.15,sp:1,wr:.5,mx:125,ac:44,gr:9,st:2.5}
];
const MX=Math.max(...CARS.map(c=>c.mx)),MA=Math.max(...CARS.map(c=>c.ac)),MG=Math.max(...CARS.map(c=>c.gr));
let save={stars:0,owned:[0],sel:0,best:0};
try{const o=JSON.parse(localStorage.getItem('cilgin-arabalar'));if(o&&o.stars)save.stars=o.stars;
 const s=JSON.parse(localStorage.getItem('cilgin-arabalar-2'));if(s&&s.owned)save=Object.assign(save,s)}catch(e){}
const persist=()=>{try{localStorage.setItem('cilgin-arabalar-2',JSON.stringify(save))}catch(e){}};

// ---------- Sahne, ışık, gökyüzü ----------
const renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.setScissorTest(true);const scene=new THREE.Scene();scene.fog=new THREE.Fog(0xcfe9ff,150,560);
const cam=new THREE.PerspectiveCamera(65,1,.1,1600);
const hemi=new THREE.HemisphereLight(0xcfe9ff,0x4a6a3a,.75);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,1);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-70,right:70,top:70,bottom:-70,near:1,far:400});sun.shadow.bias=-.0006;
scene.add(sun,sun.target);
const skyGeo=new THREE.SphereGeometry(900,24,16);
skyGeo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(skyGeo.attributes.position.count*3),3));
const sky=new THREE.Mesh(skyGeo,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,fog:false,depthWrite:false}));scene.add(sky);
const TOD=[{n:'Gündüz',t:0x2f7fe8,h:0xcfe9ff,s:0xffffff,si:1,hi:.75},{n:'Gün batımı',t:0x6a3bb8,h:0xffa060,s:0xffb070,si:.9,hi:.6},{n:'Gece',t:0x040818,h:0x1b2c5a,s:0x7f95ff,si:.35,hi:.35}];
let tod=0;
function applyTod(msg){
 const d=TOD[tod],top=new THREE.Color(d.t),hor=new THREE.Color(d.h),p=skyGeo.attributes.position,c=skyGeo.attributes.color;
 for(let i=0;i<p.count;i++){const k=Math.pow(Math.max(0,p.getY(i)/900),.55),q=hor.clone().lerp(top,k);c.setXYZ(i,q.r,q.g,q.b)}
 c.needsUpdate=true;scene.fog.color.copy(hor);sun.color.set(d.s);sun.intensity=d.si;hemi.intensity=d.hi;if(msg)toast(d.n);
}
const clouds=[];
for(let i=0;i<34;i++){const g=new THREE.Group(),m=new THREE.MeshLambertMaterial({color:0xffffff,emissive:0x555566});
 for(let j=0;j<4;j++){const s=new THREE.Mesh(new THREE.SphereGeometry(10+Math.random()*9,10,8),m);s.position.set(j*14-20,Math.random()*5,Math.random()*8);s.scale.y=.5;g.add(s)}
 g.position.set((Math.random()-.5)*1100,100+Math.random()*60,(Math.random()-.5)*1100);scene.add(g);clouds.push(g)}
function resize(){renderer.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

// ---------- Dünya: tepeler, rampalar ----------
const LIM=450;let seed=11;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
const blocks=[],hills=[],ramps=[],pads=[],rings=[],pk=[];
const inCity=(x,z)=>Math.hypot(x,z-330)<125;
const inPark=(x,z,k=1)=>(x/(215*k))**2+(z/(165*k))**2<1;
for(let i=0;i<75;i++){let x,z;do{x=(rnd()*2-1)*LIM;z=(rnd()*2-1)*LIM}while(inPark(x,z)||inCity(x,z));hills.push({x,z,a:4+rnd()*11,s2:(12+rnd()*18)**2})}
for(let i=0;i<96;i++){const t=i/24,e=Math.floor(t)%4,f=(t-Math.floor(t))*2-1,P=[[f*LIM,-LIM],[LIM,f*LIM],[-f*LIM,LIM],[-LIM,-f*LIM]][e];hills.push({x:P[0]*1.04,z:P[1]*1.04,a:30,s2:900})}
function Ht(x,z){let y=0;for(const p of hills){const dx=x-p.x,dz=z-p.z,d=(dx*dx+dz*dz)/p.s2;if(d<9)y+=p.a*Math.exp(-d)}return y}
function H(x,z){let y=Ht(x,z);for(const b of blocks)if(x>b.x0&&x<b.x1&&z>b.z0&&z<b.z1&&b.top>y)y=b.top;for(const r of ramps){const dx=x-r.x,dz=z-r.z,u=dx*r.sn+dz*r.cs;if(u<0||u>r.len)continue;const v=dx*r.cs-dz*r.sn;if(v>-r.w/2&&v<r.w/2){const q=r.b+r.ht*u/r.len;if(q>y)y=q}}return y}
const RC=[0xff8a1f,0x2a9bff,0xffd22a,0xe0262f,0x9a5cff];
function addStar(x,y,z){pk.push({x,y,z,t:0})}
function addRamp(x,z,a,len,w,ht,spin){
 const r={x,z,a,len,w,ht,sn:Math.sin(a),cs:Math.cos(a),b:Ht(x,z)};r.spin=spin||0;ramps.push(r);
 const sh=new THREE.Shape();sh.moveTo(0,0);sh.lineTo(len,0);sh.lineTo(len,ht);sh.lineTo(0,0);
 const g=new THREE.ExtrudeGeometry(sh,{depth:w,bevelEnabled:false});g.rotateY(-Math.PI/2);g.translate(w/2,0,0);
 const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:RC[ramps.length%5],roughness:.6}));
 m.position.set(x,r.b,z);m.rotation.y=a;m.castShadow=m.receiveShadow=true;scene.add(m);r.m=m;
 const ex=x+r.sn*len,ez=z+r.cs*len;
 if(!spin)for(let k=0;k<3;k++)addStar(ex+r.sn*(8+k*9),r.b+ht+3.5+(k==1?1.5:0),ez+r.cs*(8+k*9));
 if(ht>=7&&!spin)rings.push({x:ex+r.sn*13,y:r.b+ht+4.5,z:ez+r.cs*13,a,t:0});
}
addRamp(-60,-30,0,22,10,5);addRamp(60,-20,Math.PI,26,12,7);addRamp(-20,35,-Math.PI/2,28,12,8);addRamp(15,-45,Math.PI/2,24,10,6);
for(let i=0,n=0;n<22&&i<400;i++){
 const x=(rnd()*2-1)*(LIM-70),z=(rnd()*2-1)*(LIM-70);if((inPark(x,z,1.1)||inCity(x,z))||Ht(x,z)>.8)continue;
 const big=n%7==6;addRamp(x,z,rnd()*6.28,big?60:24+rnd()*16,big?22:12+rnd()*6,big?16:6+rnd()*8);n++}
for(let i=0;i<14;i++){let x,z;do{x=(rnd()*2-1)*(LIM-40);z=(rnd()*2-1)*(LIM-40)}while(inPark(x,z,1.05)||inCity(x,z));pads.push({x,z,a:rnd()*6.28,t:0})}

// ---------- Fantezi şehir (F tuşuyla ışınlan) ----------
const C0=330,BC=[0xff6f91,0x6aa0ff,0xffd166,0x8affc1,0xc084fc];
const wc=document.createElement('canvas');wc.width=wc.height=32;
{const x=wc.getContext('2d');x.fillStyle='#cfd3dc';x.fillRect(0,0,32,32);for(let i=0;i<4;i++)for(let j=0;j<4;j++){x.fillStyle=Math.random()<.6?'#ffe08a':'#2b3446';x.fillRect(i*8+2,j*8+2,4,5)}}
function addBlock(cx,cz,w,d,ht,col){
 blocks.push({x0:cx-w/2,x1:cx+w/2,z0:cz-d/2,z1:cz+d/2,top:ht});
 const t=new THREE.CanvasTexture(wc);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(Math.max(1,w/4|0),Math.max(1,ht/4|0));t.magFilter=THREE.NearestFilter;
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,ht,d),new THREE.MeshStandardMaterial({color:col,map:t,roughness:.7}));
 m.position.set(cx,ht/2,cz);m.castShadow=m.receiveShadow=true;scene.add(m);
}
for(let i=0;i<4;i++){
 const th=i*Math.PI/2,dx=Math.cos(th),dz=Math.sin(th);
 addBlock(dx*108,C0+dz*108,30,30,14,BC[i]);                 // çatısına rampayla çıkılan bina
 addRamp(dx*56,C0+dz*56,Math.atan2(dx,dz),36,14,14);
 const t2=th+Math.PI/4;addBlock(Math.cos(t2)*100,C0+Math.sin(t2)*100,26,26,30+i*7,BC[(i+2)%5]); // gökdelen
}
addRamp(0,C0,0,34,16,10,.9);            // DÖNEN RAMPA
addRamp(45,C0-45,0,22,12,7,-1.2);       // ters dönen küçük rampa
for(let i=0;i<14;i++)hills.push({x:-130+i*20,z:200,a:3.2,s2:30}); // dalgalı yol
(function(){ // gökkuşağı spiral yol
 const N=300,pos=[],col=[],idx=[],c=new THREE.Color(),f=u=>{const a=u*Math.PI*5,r=22+u*70;return{x:Math.cos(a)*r,z:C0+Math.sin(a)*r,tx:-Math.sin(a)*r+Math.cos(a)*14/Math.PI,tz:Math.cos(a)*r+Math.sin(a)*14/Math.PI}};
 for(let i=0;i<=N;i++){const u=i/N,q=f(u),l=Math.hypot(q.tx,q.tz),nx=q.tz/l,nz=-q.tx/l;
  for(let k=0;k<7;k++){const o=(k/6-.5)*14;pos.push(q.x+nx*o,.1,q.z+nz*o);c.setHSL((k/7+u*2)%1,.9,.55);col.push(c.r,c.g,c.b)}}
 for(let i=0;i<N;i++)for(let k=0;k<6;k++){const a=i*7+k;idx.push(a,a+7,a+1,a+1,a+7,a+8)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));g.setIndex(idx);
 scene.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:-4,polygonOffsetUnits:-4})));
 for(let u=.08;u<.95;u+=.07){const q=f(u);addStar(q.x,1.8,q.z)}
 for(const u of[.35,.62,.9]){const q=f(u);rings.push({x:q.x,y:4,z:q.z,a:Math.atan2(q.tx,q.tz),t:0})}
})();

// ---------- Pist ----------
const TA=140,TB=95,TW=18,NC=8;
const tp=t=>({x:TA*Math.cos(t),z:TB*Math.sin(t)}),tdir=t=>Math.atan2(-TA*Math.sin(t),TB*Math.cos(t));
for(let i=0;i<4;i++)pads.push({...tp((i*2+1)*Math.PI/4),a:tdir((i*2+1)*Math.PI/4),t:0});
const gates=[];
(function(){
 const N=180,pos=[],col=[],idx=[],cp=[],ci=[];
 for(let i=0;i<=N;i++){const t=i/N*Math.PI*2,P=tp(t),a=tdir(t),nx=Math.cos(a),nz=-Math.sin(a);
  const add=(o,y,c)=>{pos.push(P.x+nx*o,y,P.z+nz*o);col.push(c.r,c.g,c.b)};
  const rd=new THREE.Color(0x30343c),cu=new THREE.Color(i%2?0xe22:0xffffff);
  add(-TW/2,.07,rd);add(TW/2,.07,rd);
  cp.push(P.x+nx*(-TW/2-1.4),.08,P.z+nz*(-TW/2-1.4),P.x+nx*(-TW/2),.08,P.z+nz*(-TW/2),P.x+nx*(TW/2),.08,P.z+nz*(TW/2),P.x+nx*(TW/2+1.4),.08,P.z+nz*(TW/2+1.4));
  const c=cu;for(let k=0;k<4;k++)ci.push(c.r,c.g,c.b);
 }
 for(let i=0;i<N;i++){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));g.setIndex(idx);g.computeVertexNormals();
 const mat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.9,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2});
 const road=new THREE.Mesh(g,mat);road.receiveShadow=true;scene.add(road);
 const g2=new THREE.BufferGeometry(),i2=[];g2.setAttribute('position',new THREE.Float32BufferAttribute(cp,3));g2.setAttribute('color',new THREE.Float32BufferAttribute(ci,3));
 for(let i=0;i<N;i++){const a=i*4;i2.push(a,a+4,a+1,a+1,a+4,a+5,a+2,a+6,a+3,a+3,a+6,a+7)}
 g2.setIndex(i2);g2.computeVertexNormals();scene.add(new THREE.Mesh(g2,new THREE.MeshStandardMaterial({vertexColors:true,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:-3,polygonOffsetUnits:-3})));
 // kapılar
 for(let i=0;i<NC;i++){const t=i/NC*Math.PI*2,P=tp(t),a=tdir(t),g=new THREE.Group(),m=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0x222222});
