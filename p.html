<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Turbo Park</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;height:100%;overflow:hidden;background:#87ceeb;font-family:system-ui,Arial,sans-serif}
canvas#g{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #0006}
#score{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#0007;padding:6px 18px;border-radius:20px;font-size:20px;font-weight:700}
#speed{position:absolute;right:16px;bottom:16px;font-size:34px;font-weight:800}
#speed small{font-size:14px}
#mm{position:absolute;left:12px;bottom:12px;border-radius:50%;border:3px solid #fff;background:#2a7a3a99}
#pop{position:absolute;top:30%;width:100%;text-align:center;font-size:34px;font-weight:800;opacity:0;transition:opacity .3s;color:#ffe14d}
#help{position:absolute;top:12px;left:12px;font-size:12px;background:#0006;padding:6px 10px;border-radius:8px;line-height:1.5}
.b{position:fixed;width:64px;height:64px;border-radius:50%;background:#fff5;border:2px solid #fff;color:#fff;font-size:26px;display:none;align-items:center;justify-content:center;pointer-events:auto}
@media (pointer:coarse){.b{display:flex}#help{display:none}}
#gbtn{position:absolute;top:12px;right:16px;background:#ff9800;padding:8px 14px;border-radius:20px;font-weight:700;font-size:15px;pointer-events:auto;cursor:pointer}
#gar{position:fixed;left:0;right:0;bottom:0;display:none;padding:14px;background:linear-gradient(transparent,#000c 25%);color:#fff;z-index:10}
#gh{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:800;margin-bottom:10px}
#gh button,.card button{border:0;border-radius:8px;padding:7px 12px;font-weight:700;cursor:pointer;background:#ffd400}
.card button:disabled{background:#667;color:#aaa;cursor:default}
.row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.card{min-width:165px;background:#1b2a3add;border:2px solid #fff3;border-radius:12px;padding:10px;font-size:14px}
.card.sel{border-color:#ffd400}
.bl{font-size:12px;display:flex;gap:6px;align-items:center;margin:4px 0}.bl span{width:34px}
.bl i{flex:1;height:6px;background:#fff3;border-radius:4px}.bl u{display:block;height:100%;background:#4cd964;border-radius:4px}
#sbtn{position:absolute;top:56px;right:16px;background:#00acc1;padding:8px 14px;border-radius:20px;font-weight:700;font-size:15px;pointer-events:auto;cursor:pointer}
#sm{position:absolute;top:58px;left:50%;transform:translateX(-50%);display:none;background:#0007;padding:6px 14px;border-radius:14px;font-weight:700;white-space:nowrap}
</style>
</head>
<body>

  <div id="pop"></div>

<div id="gar"><div id="gh"><span id="gs"></span><button id="gx">Kapat ✕</button></div><div class="row" id="gr"></div></div>

const mm=$('mm').getContext('2d');

  mm.fillStyle='#e5533d';RAMPS.forEach(([x,z])=>{const[a,b]=P(x,z);if(Math.hypot(a-65,b-65)<62)mm.fillRect(a-4,b-4,8,8)});
  mm.fillStyle='#ffd400';stars.forEach(o=>{const[a,b]=P(o.position.x,o.position.z);if(Math.hypot(a-65,b-65)<62){mm.beginPath();mm.arc(a,b,2.5,0,6.3);mm.fill()}});

let SV={stars:0,own:[0],sel:0};try{Object.assign(SV,JSON.parse(localStorage.getItem('turboPark2')||'{}'))}catch(e){}
function save(){try{localStorage.setItem('turboPark2',JSON.stringify(SV))}catch(e){}}

function applyCar(i){const c=CARS[i];car.scale.set(c.w||1,c.h||1,c.l||1);cab.material.color.set(c.gl||0xcfe9ff);body.material.color.set(c.col);sp.material.color.set(c.col);strp.material.color.set(c.ac);Object.assign(P,{vmax:c.vmax,acc:c.acc,turn:c.turn})}

function render(){$('gs').textContent='🏠 Garaj · ⭐ '+st.score;const el=$('gr');el.innerHTML='';
 CARS.forEach((c,i)=>{const own=SV.own.includes(i),d=document.createElement('div');d.className='card'+(i===SV.sel?' sel':'');
  d.innerHTML='<b><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:#'+c.col.toString(16).padStart(6,'0')+'"></span> '+c.n+'</b><div style="font-size:11px;opacity:.7">'+c.t+'</div>'+bar('Hız',c.vmax/130)+bar('İvme',c.acc/75)+bar('Yön',c.turn/1.5);

  d.appendChild(b);d.onclick=()=>applyCar(i);el.appendChild(d)})}
let gOpen=false,gCool=0;
function openG(){gOpen=true;for(const k in K)K[k]=0;st.v=0;$('gar').style.display='block';render()}
function closeG(){gOpen=false;applyCar(SV.sel);$('gar').style.display='none';gCool=performance.now()+3000}
$('gbtn').onclick=()=>gOpen?closeG():openG();$('gx').onclick=closeG;
addEventListener('keydown',e=>{if(e.code==='KeyG')gOpen?closeG():openG();if(e.code==='Escape'&&gOpen)closeG()});
let maxS=0,fin=false;
function snapCam(){C.position.set(st.x-Math.sin(st.h)*9,st.y+5,st.z-Math.cos(st.h)*9)}
function startS(){if(gOpen)return;strMode=true;maxS=0;fin=false;reset();snapCam();$('sbtn').textContent='↩ Haritaya dön';$('sm').style.display='block'}
function exitS(){strMode=false;st.x=-15;st.z=-14;st.y=0;st.h=Math.PI/2;st.v=0;st.vy=0;st.air=false;snapCam();gCool=performance.now()+3000;$('sbtn').textContent='🛣️ Düz Yol';$('sm').style.display='none'}
$('sbtn').onclick=()=>strMode?exitS():startS();
applyCar(SV.sel);
// dongu
let last=performance.now(),rot=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;rot+=dt*3;if(gOpen){const a=rot*.4;C.position.set(st.x+Math.sin(a)*8,st.y+3,st.z+Math.cos(a)*8);C.lookAt(st.x,st.y+1,st.z);dome.position.copy(C.position);R.render(S,C);return}
  const up=K.KeyW||K.ArrowUp,dn=K.KeyS||K.ArrowDown,lf=K.KeyA||K.ArrowLeft,rt=K.KeyD||K.ArrowRight;
  const thr=(up?1:0)-(dn?1:0),str=(lf?1:0)-(rt?1:0);
  if(!st.air){
    if(thr>0)st.v+=(st.v<0?45:P.acc)*dt;else if(thr<0)st.v-=(st.v>0?45:14)*dt;
    st.v*=1-(K.Space?2.2:.35)*dt;if(!thr&&Math.abs(st.v)<.3)st.v=0;
    st.v=Math.max(-12,Math.min(st.v,P.vmax));
    st.h+=str*P.turn*Math.min(1,Math.abs(st.v)/8)*(st.v>=0?1:-1)*(1.9-Math.min(st.v,P.vmax)/P.vmax*.8)*dt;
  }else st.h+=str*.6*dt;
  const ox=st.x,oz=st.z;
  st.x+=Math.sin(st.h)*st.v*dt;st.z+=Math.cos(st.h)*st.v*dt;
  const lim=strMode?1950:1300;st.x=Math.max(-lim,Math.min(lim,st.x));st.z=Math.max(-lim,Math.min(lim,st.z));
  for(const [tx,tz,tr=1.8] of trees){const d=Math.hypot(st.x-tx,st.z-tz);if(d<tr&&st.y<2){st.v*=.35;st.x=tx+(st.x-tx)/d*tr;st.z=tz+(st.z-tz)/d*tr}}
  for(const [tx,tz,tt] of TUN){const sn=Math.sin(tt),cs2=Math.cos(tt),lc=(x,z)=>[(x-tx)*sn+(z-tz)*cs2,(x-tx)*cs2-(z-tz)*sn],a=lc(ox,oz),b=lc(st.x,st.z);if(Math.abs(b[0])<TL/2&&(Math.abs(a[1])-8.2)*(Math.abs(b[1])-8.2)<0){st.x=ox;st.z=oz;st.v*=.4}}
  let gh=H(st.x,st.z);if(gh-st.y>.7+SL*Math.abs(st.v)*dt*1.5){st.x=ox;st.z=oz;st.v*=.3;gh=H(st.x,st.z)}
  if(!st.air){
    st.vyG=(gh-st.y)/Math.max(dt,.001);
    if(gh<st.y-.12&&st.v>6){st.air=true;st.vy=Math.max(st.vyG,0);st.at=0}else st.y=gh;
  }
  if(st.air){st.vy-=26*dt;st.y+=st.vy*dt;st.at+=dt;
    if(st.y<=gh){st.y=gh;st.air=false;
      if(st.at>.7){const p=Math.round(st.at*20);pop('HAVA SÜRESİ '+st.at.toFixed(1)+'s  +'+p);st.score+=0}
      if(st.vy<-14)st.v*=.7;st.vy=0}}
  // pitch
  const f=H(st.x+Math.sin(st.h)*1.6,st.z+Math.cos(st.h)*1.6),b=H(st.x-Math.sin(st.h)*1.6,st.z-Math.cos(st.h)*1.6);
  const tp=st.air?Math.atan2(st.vy,Math.max(Math.abs(st.v),8)):Math.atan2(f-b,3.2);
  st.pitch+=(tp-st.pitch)*Math.min(1,dt*(st.air?3:12));
  car.position.set(st.x,st.y,st.z);car.rotation.y=st.h;car.rotation.x=-st.pitch;sun.position.set(st.x+60,st.y+100,st.z+40);sun.target.position.set(st.x,st.y,st.z);sun.target.updateMatrixWorld();if(performance.now()>gCool&&Math.hypot(st.x+29,st.z)<5&&st.y<1)openG();if(!strMode&&performance.now()>gCool&&Math.hypot(st.x+29,st.z+14)<4&&st.y<1)startS();dome.position.copy(C.position);sd.position.set(C.position.x+1200,1100,C.position.z+700);
  // yildiz topla
  for(let i=stars.length-1;i>=0;i--){const o=stars[i];o.rotation.y=rot;
    if(Math.hypot(o.position.x-st.x,o.position.z-st.z)<2.6&&Math.abs(o.position.y-st.y-1)<3.2){S.remove(o);stars.splice(i,1);const gv=o.position.y>2?5:1;st.score+=gv;if(gv>1)pop('+5 ⭐ HAVADA!');
      SV.stars=st.score;save();const pp=o.position;setTimeout(()=>mkStar(pp.x,pp.y,pp.z),20000)}}
  $('score').textContent='⭐ '+st.score;
  $('speed').innerHTML=Math.round(Math.abs(st.v)*3.2)+' <small>km/s</small>';
  if(strMode){const k=Math.abs(st.v)*3.2;if(k>maxS)maxS=k;$('sm').textContent='Düz yol · '+Math.max(0,Math.round(st.z+1450))+' m · En yüksek: '+Math.round(maxS)+' km/s';if(st.z>1480&&!fin){fin=true;pop('BİTİŞ! En yüksek hız: '+Math.round(maxS)+' km/s')}}
  // kamera
  const cd=st.air?11:9,tx=st.x-Math.sin(st.h)*cd,tz=st.z-Math.cos(st.h)*cd,ty=st.y+4.5+Math.abs(st.v)*.02;
  C.position.x+=(tx-C.position.x)*Math.min(1,dt*6);C.position.z+=(tz-C.position.z)*Math.min(1,dt*6);C.position.y+=(ty-C.position.y)*Math.min(1,dt*5);
  C.lookAt(st.x+Math.sin(st.h)*4,st.y+1.2,st.z+Math.cos(st.h)*4);
  C.fov=65+Math.min(Math.abs(st.v),70)*.3;C.updateProjectionMatrix();
  mini();R.render(S,C)}
C.position.set(0,5,-9);requestAnimationFrame(loop);
