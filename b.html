<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Potato Arena</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#1d140d;--fg:#fff1d6;--b:#3b8cff;--r:#ff4d4d}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden;touch-action:manipulation}
#arena{flex:1;min-height:0;position:relative}
#x{position:absolute;top:8px;left:8px;width:34px;height:34px;border-radius:17px;border:0;background:#000a;color:#fff;font-size:16px}
#tm{position:absolute;top:8px;right:8px;background:#000a;padding:3px 10px;border-radius:10px;font-weight:700;font-size:14px;pointer-events:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
.panel{flex:none;padding:6px;display:flex;flex-direction:column;gap:5px;background:#2a1c12}
.rot{transform:rotate(180deg)}
.el{height:18px;border-radius:9px;background:#0006;position:relative;overflow:hidden}
.el i{display:block;height:100%;width:50%;background:linear-gradient(#e56bff,#a02bd6)}
.el b{position:absolute;inset:0;text-align:center;font-size:12px;line-height:18px}
.hand{display:flex;gap:6px}
.hand button{flex:1;position:relative;border:2px solid #6b4a2b;border-radius:10px;background:#4a321e;color:var(--fg);padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;font:inherit}
.hand button em{font-style:normal;font-size:26px;line-height:30px}
.hand button small{font-size:9px;text-align:center;line-height:11px;height:22px}
.hand button .c{position:absolute;top:-6px;left:-4px;background:#a02bd6;border-radius:50%;width:20px;height:20px;font-size:12px;line-height:20px;text-align:center;font-weight:700}
.hand button.sel{border-color:#ffd54a;background:#6d4a22;transform:translateY(-4px)}
.hand button.no{opacity:.5}
.ov{position:fixed;inset:0;background:#000b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;z-index:5}
.ov h1{font-size:40px;margin:0;color:#ffd54a}
.ov p{margin:0;opacity:.85;max-width:300px;font-size:14px}
.ov button{font:inherit;font-size:18px;padding:12px 28px;border-radius:12px;border:0;background:#e0a040;color:#2a1c12;font-weight:700;min-width:220px}
#end{display:none}
</style></head><body>
<div id="top" class="panel rot" style="display:none"><div class="el"><i></i><b>5</b></div><div class="hand"></div></div>
<div id="arena"><canvas id="cv"></canvas><div id="tm">3:00</div><button id="x" onclick="menu()">✕</button></div>
<div id="bot" class="panel"><div class="el"><i></i><b>5</b></div><div class="hand"></div></div>
<div id="menu" class="ov"><h1>🥔 Potato Arena</h1><p>Kart seç, sonra arenada kendi yarına dokun. Kuleleri yık, kralı devir!</p>
<button onclick="start('bot')">🤖 Bota karşı</button><button onclick="start('2p')">👥 2 kişilik (aynı telefon)</button></div>
<div id="end" class="ov"><h1 id="et"></h1><button onclick="start(G.mode)">Tekrar oyna</button><button onclick="menu()">Menü</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const W=360,H=640,RY=320,$=s=>document.querySelector(s);
const C={
sovalye:{n:'Patates Şövalye',e:'🥔',c:3,hp:700,dmg:85,range:20,rate:1,sp:38,s:15},
nuke:{n:'Nükleer Bomba',e:'☢️',c:6,spell:1},
sinsi:{n:'Sinsi Ornitorenk',e:'🦆',c:3,hp:110,dmg:32,range:18,rate:.7,sp:80,s:11},
kirpi:{n:'Okçu Kirpi',e:'🦔',c:3,hp:210,dmg:48,range:115,rate:.9,sp:42,s:12},
bekci:{n:'Armut Bekçisi',e:'🏡',c:3,bld:1,hp:650,dmg:42,range:125,rate:.8,s:14},
babun:{n:'Babun',e:'🐒',c:4,only:1,hp:520,dmg:85,range:18,rate:.9,sp:65,s:14},
kartopu:{n:'Kartopu',e:'❄️',c:2,spell:1},
buyucu:{n:'Şok Büyücüsü',e:'🧙',c:4,hp:240,dmg:65,range:95,rate:1.1,sp:38,s:13,stun:1}};
const IDS=Object.keys(C),cv=$('#cv');
let G=null,last=0;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function fit(){resize3d()}
addEventListener('resize',fit);
function menu(){$('#end').style.display='none';$('#menu').style.display='flex';G=null}
function start(mode){
 const mk=()=>{const d=[...IDS].sort(()=>Math.random()-.5);return{el:5,hand:d.slice(0,4),q:d.slice(4),sel:-1}};
 G={mode,u:[],tw:[],fx:[],sp:[],t:180,over:false,bot:2,p:{b:mk(),r:mk()}};
 for(const t of['b','r']){const ky=t==='b'?585:55,py=t==='b'?495:145;
  G.tw.push({team:t,x:180,y:ky,hp:1800,max:1800,k:1,rad:26,cd:0,rg:130,d:55});
  for(const px of[90,270])G.tw.push({team:t,x:px,y:py,hp:1000,max:1000,k:0,rad:20,cd:0,rg:130,d:45});}
 $('#menu').style.display='none';$('#end').style.display='none';
 $('#top').style.display=mode==='bot'?'none':'flex';
 dyn.clear();renderHand('b');renderHand('r');fit();last=performance.now();
}
function renderHand(t){
 const P=G.p[t],h=$(t==='b'?'#bot .hand':'#top .hand');h.innerHTML='';
 P.hand.forEach((id,i)=>{const b=document.createElement('button'),c=C[id];
  b.innerHTML=`<span class="c">${c.c}</span><em>${c.e}</em><small>${c.n}</small>`;
  if(P.sel===i)b.className='sel';
  b.onpointerdown=ev=>{ev.preventDefault();P.sel=P.sel===i?-1:i;renderHand(t)};
  h.appendChild(b)});
}
cv.addEventListener('pointerdown',e=>{
 if(!G||G.over)return;
 const{x,y}=pick(e);
 const order=G.mode==='bot'?['b']:(y>RY?['b','r']:['r','b']);
 for(const t of order){if(G.p[t].sel>=0&&place(t,x,y))return}
});
function mkU(id,team,x,y){const c=C[id];return{...c,id,team,x,y,max:c.hp,cd:0,stun:0,slow:0}}
function place(t,x,y){
 const P=G.p[t],id=P.hand[P.sel],c=C[id];
 if(P.el<c.c)return false;
 if(!c.spell){if(t==='b'?y<RY+12:y>RY-12)return false;y=Math.max(30,Math.min(610,y));x=Math.max(15,Math.min(345,x))}
 P.el-=c.c;
 if(id==='nuke')G.sp.push({x,y,t:1.2,team:t,m:1.2});
 else if(id==='kartopu'){area(x,y,60,110,t,.35,1);G.fx.push({k:'c',x,y,r:60,t:.4,m:.4,c:'#bdf'})}
 else{G.fx.push({k:'c',x,y,r:24,t:.4,m:.4,c:t==='b'?'#6af':'#f77'});const n=c.cnt||1;for(let i=0;i<n;i++)G.u.push(mkU(id,t,x+(i?16:0)-(n>1?8:0),y))}
 P.q.push(id);P.hand[P.sel]=P.q.shift();P.sel=-1;renderHand(t);return true;
}
function area(x,y,r,a,team,tm,slow){
 for(const u of G.u)if(u.team!==team&&dist({x,y},u)<r+u.s){u.hp-=a;if(slow)u.slow=3}
 for(const w of G.tw)if(w.team!==team&&w.hp>0&&dist({x,y},w)<r+w.rad)w.hp-=a*tm;
}
function pickTower(u){
 let best=null,bd=1e9,king=null;
 for(const w of G.tw){if(w.team===u.team||w.hp<=0)continue;if(w.k){king=w;continue}const d=dist(u,w);if(d<bd){bd=d;best=w}}
 return best||king;
}
function upU(u,dt){
 if(u.stun>0){u.stun-=dt;return}
 if(u.slow>0)u.slow-=dt;
 u.cd-=dt;const sf=u.slow>0?.5:1;
 if(u.bld){u.hp-=u.max/30*dt;let bt=null,bb=u.range;
  for(const o of G.u)if(o.team!==u.team){const d=dist(u,o);if(d<bb){bb=d;bt=o}}
  if(bt&&u.cd<=0){u.cd=u.rate/sf;bt.hp-=u.dmg;G.fx.push({k:'l',x:u.x,y:u.y,x2:bt.x,y2:bt.y,t:.15,m:.15,c:'#cde85a'})}
  return}
 let tg=null,bd=1e9,isT=false;
 for(const o of G.u)if(o.team!==u.team&&(!u.only||o.bld)){const d=dist(u,o);if(d<bd){bd=d;tg=o}}
 if(!tg||(!u.only&&bd>95)){tg=pickTower(u);isT=true}
 if(!tg)return;
 const d=dist(u,tg),rad=isT?tg.rad:tg.s;
 if(d<=u.range+rad+u.s*.3){
  if(u.cd<=0){u.cd=u.rate/sf;
   if(u.range>40)G.fx.push({k:'l',x:u.x,y:u.y,x2:tg.x,y2:tg.y,t:.15,m:.15,c:u.stun?'#ff0':(u.team==='b'?'#8cf':'#f99')});
   tg.hp-=u.dmg;if(u.stun&&!isT){tg.stun=.6;G.fx.push({k:'c',x:tg.x,y:tg.y,r:14,t:.3,m:.3,c:'#ff0'})}}
  return}
 let wx=tg.x,wy=tg.y;const side=u.team==='b'?1:-1;
 if((u.y-RY)*side>-22&&(tg.y-RY)*side<0){wx=Math.abs(u.x-90)<Math.abs(u.x-270)?90:270;wy=RY-side*30}
 const dx=wx-u.x,dy=wy-u.y,l=Math.hypot(dx,dy)||1,st=Math.min(l,u.sp*sf*dt);
 u.x+=dx/l*st;u.y+=dy/l*st;
}
function upT(w,dt){
 w.cd-=dt;if(w.cd>0)return;
 let tg=null,bd=w.rg;
 for(const u of G.u)if(u.team!==w.team){const d=dist(w,u);if(d<bd){bd=d;tg=u}}
 if(tg){w.cd=1;tg.hp-=w.d;G.fx.push({k:'l',x:w.x,y:w.y,x2:tg.x,y2:tg.y,t:.15,m:.15,c:w.team==='b'?'#8cf':'#f99'})}
}
function botPlay(){
 const P=G.p.r,ok=P.hand.map((id,i)=>i).filter(i=>C[P.hand[i]].c<=P.el);
 if(!ok.length||(P.el<4&&Math.random()<.5))return;
 const i=ok[Math.floor(Math.random()*ok.length)],id=P.hand[i];let x,y;
 const foes=G.u.filter(u=>u.team==='b');
 if(id==='nuke'||id==='kartopu'){
  let bc=null,bn=0;
  for(const f of foes){const n=foes.filter(o=>dist(o,f)<70).length;if(n>bn){bn=n;bc=f}}
  if(id==='kartopu'&&bn>=2){x=bc.x;y=bc.y}
  else if(id==='nuke'&&bn>=3){x=bc.x;y=bc.y}
  else if(id==='nuke'&&Math.random()<.4){const ts=G.tw.filter(w=>w.team==='b'&&w.hp>0&&!w.k);if(!ts.length)return;const w=ts[Math.floor(Math.random()*ts.length)];x=w.x;y=w.y}
  else return;
 }else{
  const thr=foes.filter(u=>u.y<RY).sort((a,b)=>a.y-b.y)[0];
  x=thr?thr.x:(Math.random()<.5?90:270)+(Math.random()-.5)*50;y=110+Math.random()*130;
 }
 P.sel=i;place('r',x,y);P.sel=-1;
}
function update(dt){
 G.t-=dt;const rate=G.t<60?1.5:.75;
 for(const t of['b','r'])G.p[t].el=Math.min(10,G.p[t].el+rate*dt);
 if(G.mode==='bot'){G.bot-=dt;if(G.bot<=0){G.bot=1.2+Math.random()*1.6;botPlay()}}
 for(const u of G.u)upU(u,dt);
 for(let i=0;i<G.u.length;i++)for(let j=i+1;j<G.u.length;j++){
  const a=G.u[i],b=G.u[j];if(a.bld&&b.bld)continue;
  const dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy),m=(a.s+b.s)*.8;
  if(d<m&&d>.01){const p=(m-d)/d,wa=a.bld?0:b.bld?1:.5,wb=1-wa;a.x+=dx*p*wa;a.y+=dy*p*wa;b.x-=dx*p*wb;b.y-=dy*p*wb}}
 for(const u of G.u)if(!u.bld){
  u.x=Math.max(8,Math.min(352,u.x));u.y=Math.max(8,Math.min(632,u.y));
  if(Math.abs(u.y-RY)<17&&Math.abs(u.x-90)>32&&Math.abs(u.x-270)>32)u.y=u.y<RY?RY-17:RY+17}
 for(const w of G.tw)if(w.hp>0)upT(w,dt);
 for(const s of G.sp){s.t-=dt;if(s.t<=0){s.done=1;area(s.x,s.y,80,480,s.team,.35);G.fx.push({k:'c',x:s.x,y:s.y,r:80,t:.5,m:.5,c:'#ffa63a'})}}
 G.sp=G.sp.filter(s=>{if(s.done&&s.o)dyn.remove(s.o);return!s.done});
 G.u=G.u.filter(u=>{if(u.hp<=0){if(u.o)dyn.remove(u.o);G.fx.push({k:'c',x:u.x,y:u.y,r:u.s*1.5,t:.35,m:.35,c:'#ffffff'})}return u.hp>0});
 for(const f of G.fx)f.t-=dt;G.fx=G.fx.filter(f=>{if(f.t<=0&&f.o)dyn.remove(f.o);return f.t>0});
 for(const w of G.tw)if(w.k&&w.hp<=0)return finish(w.team==='b'?'r':'b');
 if(G.t<=0){
  const cnt=t=>G.tw.filter(w=>w.team===t&&w.hp>0).length,hp=t=>G.tw.filter(w=>w.team===t).reduce((s,w)=>s+Math.max(0,w.hp),0);
  const a=cnt('b'),b=cnt('r'),ha=hp('b'),hb=hp('r');
  finish(a!==b?(a>b?'b':'r'):ha!==hb?(ha>hb?'b':'r'):null);
 }
}
function finish(w){
 G.over=true;
 $('#et').textContent=!w?'Berabere!':G.mode==='bot'?(w==='b'?'🏆 Kazandın!':'🤖 Bot kazandı'):(w==='b'?'🔵 Mavi Patates kazandı!':'🔴 Kırmızı Patates kazandı!');
 $('#end').style.display='flex';
}
const TB=0x1f7bff,TR=0xff2a2a,EL=1.08;
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9fd4ff);scene.fog=new THREE.Fog(0xcfe8ff,1500,3200);
const cam=new THREE.PerspectiveCamera(34,.56,10,3500);
function resize3d(){
 const r=$('#arena').getBoundingClientRect(),a=r.width/r.height;
 renderer.setSize(r.width,r.height,false);cam.aspect=a;
 const t=Math.tan(cam.fov*Math.PI/360),d=Math.max(200/(t*a)+320*Math.cos(EL),650*Math.sin(EL)/(2*t)+60);
 cam.position.set(0,d*Math.sin(EL),d*Math.cos(EL)+10);cam.lookAt(0,0,10);cam.updateProjectionMatrix();
}
scene.add(new THREE.HemisphereLight(0xffffff,0x6a9a4a,.95));
const sun=new THREE.DirectionalLight(0xfff0d0,.95);sun.position.set(-250,500,300);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0006;Object.assign(sun.shadow.camera,{left:-270,right:270,top:380,bottom:-380,near:10,far:1500});scene.add(sun);
const M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.7,metalness:.05},o||{}));
function mesh(geo,col,x,y,z){const m=new THREE.Mesh(geo,col.isMaterial?col:M(col));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;return m}
const sph=(r,c,x,y,z,sx=1,sy=1,sz=1)=>{const m=mesh(new THREE.SphereGeometry(r,16,12),c,x,y,z);m.scale.set(sx,sy,sz);return m};
const box=(w,h,d,c,x,y,z)=>mesh(new THREE.BoxGeometry(w,h,d),c,x,y,z);
const cone=(r,h,c,x,y,z,s=12)=>mesh(new THREE.ConeGeometry(r,h,s),c,x,y,z);
const cyl=(r1,r2,h,c,x,y,z,s=16)=>mesh(new THREE.CylinderGeometry(r1,r2,h,s),c,x,y,z);
function plane(w,h,mat,x,y,z){const g=new THREE.PlaneGeometry(w,h);g.rotateX(-Math.PI/2);const m=new THREE.Mesh(g,mat);m.position.set(x,y,z);m.receiveShadow=true;scene.add(m);return m}
function cvTex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'));const t=new THREE.CanvasTexture(c);t.anisotropy=4;t.wrapS=t.wrapT=THREE.RepeatWrapping;return t}
// arena
plane(2200,2600,M(0x3a9a26),0,-1,0);
plane(360,640,M(0xffffff,{map:cvTex(512,512,x=>{for(let i=0;i<16;i++){x.fillStyle=i%2?'#46b02c':'#55c637';x.fillRect(0,i*32,512,32)}for(let i=0;i<2500;i++){x.fillStyle=Math.random()<.5?'#ffffff12':'#00000014';x.fillRect(Math.random()*512,Math.random()*512,2,5)}})}),0,0,0);
for(const lx of[-90,90])plane(70,640,new THREE.MeshBasicMaterial({color:0xf0cc6a,transparent:true,opacity:.45}),lx,.3,0);
const wt=cvTex(256,64,x=>{x.fillStyle='#1590ff';x.fillRect(0,0,256,64);x.strokeStyle='#bfe6ff';x.lineWidth=3;for(let i=0;i<7;i++){x.beginPath();const y=8+i*9;x.moveTo(0,y);for(let k=0;k<=256;k+=32)x.quadraticCurveTo(k+8,y-5,k+16,y);x.stroke()}});
wt.repeat.set(5,1);
const water=plane(380,32,M(0xffffff,{map:wt,roughness:.15,metalness:.3}),0,.4,0);
for(const z of[-17,17])scene.add(box(380,7,3,0x9a6428,0,3,z));
for(const bx of[-90,90]){scene.add(box(60,4,42,0x9a6a3a,bx,1.5,0));for(let i=-2;i<=2;i++)scene.add(box(60,.6,.8,0x6a4a2a,bx,3.9,i*8));for(const s of[-1,1]){scene.add(box(3,9,42,0x7a5230,bx+s*28,6,0))}}
for(let z=-340;z<=340;z+=48)for(const s of[-1,1]){
 const x=s*(208+Math.random()*30),k=.8+Math.random()*.7,t=new THREE.Group();
 t.add(cyl(4*k,5*k,22*k,0x6a4a2a,0,11*k,0,8),cone(18*k,34*k,0x1c9a2c,0,34*k,0),cone(13*k,26*k,0x2eb83a,0,52*k,0));
 t.position.set(x,0,z+Math.random()*20);t.traverse(o=>{o.castShadow=true});scene.add(t)}
const zoneB=plane(360,308,new THREE.MeshBasicMaterial({color:TB,transparent:true,opacity:.16,depthWrite:false}),0,.9,166);
const zoneR=plane(360,308,new THREE.MeshBasicMaterial({color:TR,transparent:true,opacity:.16,depthWrite:false}),0,.9,-166);
{const sk=cvTex(2,256,x=>{const gr=x.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#2a86f0');gr.addColorStop(1,'#dff1ff');x.fillStyle=gr;x.fillRect(0,0,2,256)});sk.wrapS=sk.wrapT=THREE.ClampToEdgeWrapping;scene.background=sk}
for(const[x,z,r]of[[-90,-175,40],[90,-175,40],[0,-265,50],[-90,175,40],[90,175,40],[0,265,50]]){const pz=cyl(r,r+2,1.2,0xcfc6b0,x,.6,z,32),col=z<0?TR:TB,rg=mesh(new THREE.TorusGeometry(r-4,1.4,6,40),M(col,{emissive:col,emissiveIntensity:.3}),x,1.4,z);pz.castShadow=false;rg.rotation.x=Math.PI/2;rg.castShadow=false;scene.add(pz,rg)}
for(const sx of[-1,1])scene.add(box(4,8,664,0xb9b2a5,sx*186,4,0));for(const sz of[-1,1])scene.add(box(376,8,4,0xb9b2a5,0,4,sz*332));
for(let i=0;i<46;i++){const sx=Math.random()<.5?-1:1,x=sx*(140+Math.random()*38),z=(Math.random()-.5)*620;if(Math.abs(z)<26)continue;
 if(Math.random()<.3)scene.add(sph(3+Math.random()*3,0x8f9498,x,2,z,1,.7,1));else{const r=4+Math.random()*4;scene.add(sph(r,0x2fae2a,x,r*.6,z,1,.75,1));if(Math.random()<.6)scene.add(sph(1.6,[0xffd54a,0xff7a9a,0xffffff][i%3],x+2,r*.9,z+2))}}
const dyn=new THREE.Group();scene.add(dyn);
// models
function mkBar(w,h,y){
 const gp=new THREE.Group(),mk=(c,o)=>{const s=new THREE.Sprite(new THREE.SpriteMaterial({color:c,transparent:true,opacity:o,depthTest:false}));s.center.set(0,.5);return s};
 const bg=mk(0,.7),fg=mk(0x66ccff,1);bg.scale.set(w+3,h+3,1);bg.position.x=-w/2-1.5;fg.scale.set(w,h,1);fg.position.x=-w/2;bg.renderOrder=10;fg.renderOrder=11;
